# Local infrastructure. `pnpm db:up` starts Postgres with the pgvector extension available.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
      POSTGRES_DB: triage
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U triage']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
